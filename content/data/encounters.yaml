# The tank fights to the boss music, kept after the owner tried it, on the street fights' band (the owner, 2026-10-18).
# It blows up where the fight left the camera, with no pan to it (the owner, 2026-10-23: "let's have the camera not
# pan to focus on the tank when it explodes at the end of the battle").
# The tank keeps battle.yaml's 7 s a decision (the owner, 2026-11-06, after the novice study: "Just leave 7s").
tank:
  cry: cry_tank
  reinforcement_cry: cry_tank_backups
  music: boss
  flag: tank_defeated
  after: tank_after
  keep_framing: true

# The Warsaw Pac's fight stays sideways on phones too, the party in a column facing him (the owner, 2026-10-05:
# his rifle points sideways, and the column leaves room for the ricochets on the ground).
# Berlin's music keeps playing through the Warsaw Pac's fight, to try how it feels (the owner, 2026-10-18).
boss:
  music: berlin
  column: true
  cry: cry_boss
  scripted: true
  boss: true
  # Losing here sends an unprepared party back for the speed pellet, and the trio talks of it on the way back in.
  no_escape: true
  after: boss_defeated
  flag: boss_defeated
