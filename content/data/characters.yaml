# actor: who the balloon points at. A party member id (olli, ronnie, gorbie), the name of a
#        map object from Tiled, "encounter" for the enemies in the current fight, or "none".
# voice: pitch of the typing sound, in hertz.
# style: balloon (speech), shout (jagged balloon), boss (dark red lettering), caption (box).
# label: the name shown on the balloon, if different from the script name.

