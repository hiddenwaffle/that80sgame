# The first ghost in the maze, for players new to fights. Frightened, as Pac-Man's
# ghosts turn: slow to act, and it hits for about 2, so a new player can read the fight without being
# hurt. It stands to one side of the way in and can be walked past. Enough HP for about six of the party's
# plain attacks at level 1 (the owner, 2026-10-03; simulated, misses counted: a median of 6, rarely 4 or
# fewer; 120 before, about 2.6).
ghost_blue:
  name: Ghost
  look: ghost_blue
  hp: 330
  attack: 2
  xp: 15
  dots: 10
  timer: [6, 7]

