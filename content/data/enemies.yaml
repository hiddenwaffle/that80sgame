# Finale gimmick, with no turn queue or individual decision deadlines.
# Qualification is fixed at entry. Grind stats guarantee five offensive hits;
# otherwise the pellet permits nine hits before its longer fuse. Unprepared hits do no real damage.
# HP represents the show, not a defense/damage calculation. Animations keep charging the fuse.
boss:
  name: Warsaw Pac
  look: boss
  hp: 600
  finale:
    # Archived full-maze loops are L7 after 20 minutes; shorter loops reach it later.
    grind_strength: { olli: 139, ronnie: 159, gorbie: 119 }
    grind_hits: 5
    pellet_hits: 9
    # 15 real seconds: a choice about every 1.25 s. 20 was tried and was too slow (the owner, 2026-11-06).
    pellet_countdown: 15
  attack: 9999
  # Finale celebration: 500 XP each keeps the familiar reward/level-up presentation.
  xp: 1500
  dots: 0
  timer: [999, 999]
  countdown: 8
