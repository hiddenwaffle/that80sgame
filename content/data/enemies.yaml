# Stands in the corridor to the bridge. Worth no XP: what it calls in pays instead, so skipping the 3-ghost groups keeps a
# party at level 1, and clearing them first means fewer come. At level 1 with all three helpers, a player using specials wins
# more often than at the tank, one without them almost never (the owner, 2026-11-01; tests/giant_ghost.test.ts plays it through).
ghost_giant:
  name: Giant Ghost
  look: ghost_giant
  hp: 1000
  attack: 25
  xp: 0
  dots: 40
  timer: [3, 3]
  blast:
    name: Boo!
    damage: 60
    before: gorbie

