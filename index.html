<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e9e2cf" />
    <!-- The tab icon is Olli, drawn as the game draws him (public/). favicon.ico holds 16, 32 and 48 px; the 180 px picture is the
         iPhone home screen's, on the game's cream because iOS fills clear pixels with black; the manifest names the 192 and 512 px
         Android icons and a padded one for round and rounded-square masks. Named here so no browser asks the site root for an icon. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="apple-touch-icon" href="/icons/apple_touch_icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- What search results and link previews show. Chat apps read these tags without running the script, and want the picture's whole
         address, so it names the site the business cards print. public/preview.jpg is the title at 1200 by 630, with the trio placed
         where the owner put them (2026-11-14). The description is the manifest's. -->
    <meta name="description" content="A short comedy role-playing game in which three arcade heroes leave their maze for the political world of the 1980s." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="That '80s Game" />
    <meta property="og:description" content="A short comedy role-playing game in which three arcade heroes leave their maze for the political world of the 1980s." />
    <meta property="og:url" content="https://hiddenwaffle.github.io/that80sgame/" />
    <meta property="og:image" content="https://hiddenwaffle.github.io/that80sgame/preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Three round heroes walking in single file across a neon globe, beside the title That '80s Game." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The phone notice (below) comes on every load, on a screen that fits inside 820 by 1100 either way round and takes touch (a coarse
         main pointer). The script decides that once (`window.phoneNoticeApplies`, which the notice's own script reads) and, where it applies,
         puts the three font preloads into the head, before the style: the fonts are fetched at once, ahead of the game's script, the files
         the game fetches at boot anyway. The links sit in a template, which no browser acts on, so no other screen preloads what it does
         not use or is told by Firefox that a preload was skipped; and, being in the page, a build fingerprints their addresses as it does
         the style's. Put in after the style they would be fetched twice in WebKit, so the style stays below. -->
    <template id="phone-notice-fonts">
      <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/oswald/files/oswald-latin-400-normal.woff2" />
      <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/bangers/files/bangers-latin-400-normal.woff2" />
      <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/old-standard-tt/files/old-standard-tt-latin-400-italic.woff2" />
    </template>
    <script>
      window.phoneNoticeApplies = Math.max(innerWidth, innerHeight) < 1100 && Math.min(innerWidth, innerHeight) < 820 && matchMedia('(pointer: coarse)').matches;
      if (window.phoneNoticeApplies) document.head.append(document.getElementById('phone-notice-fonts').content.cloneNode(true));
    </script>
    <script>
      // What the player pressed with before the game is listening (the phone notice's Play on Phone, a tap on the loader): the game
      // takes it as the device in use, and keys and the mouse until anything is pressed (src/engine/input.ts firstDevice).
      window.firstInputDevice = null;
      addEventListener('pointerdown', function (e) { window.firstInputDevice = e.pointerType === 'mouse' ? 'mouse' : 'touch'; }, true);
      addEventListener('keydown', function (e) { if (!e.metaKey && !e.ctrlKey && !e.altKey) window.firstInputDevice = 'keyboard'; }, true);
    </script>
    <script>
      // Startup stopped: a plain first line, a Reload button, and what went wrong in small print under them (src/main.ts
      // showFailure, and the listener below). tools/globe_startup_checks.ts reads #startup-failure and its text.
      window.showStartupFailure = function (plain, detail) {
        if (document.getElementById('startup-failure')) return;
        var loader = document.getElementById('loader'), notice = document.getElementById('phone-notice');
        if (loader) loader.hidden = true;
        if (notice) notice.hidden = true;
        var page = document.createElement('div'), sheet = document.createElement('div'), title = document.createElement('h1'),
          text = document.createElement('p'), more = document.createElement('pre'), reload = document.createElement('button');
        page.id = 'startup-failure'; page.setAttribute('role', 'alertdialog'); page.setAttribute('aria-labelledby', 'startup-failure-title');
        sheet.className = 'sheet'; title.id = 'startup-failure-title'; title.textContent = 'The game could not start';
        text.textContent = plain; more.textContent = detail || ''; reload.type = 'button'; reload.textContent = 'Reload';
        reload.addEventListener('click', function () { location.reload(); });
        sheet.append(title, text, reload, more); page.append(sheet); document.body.append(page); reload.focus();
      };
      // A script of the game's that does not arrive (the main one, or a chunk it preloads) used to leave the loader chomping at
      // 0% for ever (Fable review F3, 2026-11-09). Its element fires an error, which does not bubble, so this listens on the way in.
      window.addEventListener('error', function (e) {
        var t = e.target;
        var ours = t instanceof HTMLScriptElement || (t instanceof HTMLLinkElement && t.rel === 'modulepreload');
        if (ours) window.showStartupFailure('Part of the game did not arrive. Check the connection, then reload.', 'Could not load ' + (t.src || t.href));
      }, true);
    </script>
    <title>That '80s Game</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e9e2cf;
        /* Stop the page from scrolling, zooming, bouncing, or selecting. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        /* Safari enlarges text in landscape; the game sizes its own. */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        touch-action: none;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      /* The loading page (src/ui/loader.ts): a blue ball with a white cross eating along the dots, before the script arrives. */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #e9e2cf;
        transition: opacity 0.25s ease-out;
      }
      #loader[hidden] {
        display: none;
      }
      /* Fading out it still takes taps, so none made before it has gone reaches the title behind it (the owner, 2026-11-14). */
      #loader.gone {
        opacity: 0;
      }
      /* Shown again over the title: it takes taps at once and fades in after a moment, so a short wait does not flash it. */
      #loader.again {
        animation: loader-in 0.2s ease-out 0.3s both;
      }
      #loader svg {
        width: min(70vw, 320px);
        height: auto;
        overflow: visible;
      }
      #loader-ball {
        transition: transform 0.35s ease-out;
      }
      #loader-dots circle {
        transition: opacity 0.1s;
      }
      /* In the game's face for numbers once its script has loaded it (src/render/fonts.ts), a plain one before. */
      #loader-share,
      #loader-left {
        margin: 0;
        color: #1b1a1f;
        font-family: Oswald, 'Arial Narrow', Arial, sans-serif;
        font-weight: 400;
        line-height: 1.35;
        letter-spacing: 0.04em;
        text-align: center;
      }
      #loader-share {
        margin-top: 10px;
        font-size: clamp(15px, 4.2vw, 19px);
      }
      /* Kept a line tall while empty, so the dots do not move when it fills. */
      #loader-left {
        min-height: 1.35em;
        opacity: 0.75;
        font-size: clamp(13px, 3.6vw, 16px);
      }
      /* With JavaScript off, a page saying so, over the loading page that would otherwise wait for ever. */
      #no-script {
        position: fixed;
        inset: 0;
        z-index: 11;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        margin: 0;
        padding: 24px;
        background: #e9e2cf;
        color: #1b1a1f;
        font-family: Oswald, 'Arial Narrow', Arial, sans-serif;
        font-size: clamp(17px, 4.6vw, 22px);
        line-height: 1.4;
        letter-spacing: 0.03em;
        text-align: center;
      }
      @keyframes loader-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* Reduced motion (set by the script below and by src/ui/loader.ts): no sliding or fading. */
      #loader.still,
      #loader.still #loader-ball {
        transition: none;
      }
      /* The phone notice: on a small touch screen, a full-width cream band over the loading page, centred by the script below in the screen's bottom half; the loading page is centred above it. */
      @font-face { font-family: Oswald; font-weight: 400; font-display: swap; src: url('/node_modules/@fontsource/oswald/files/oswald-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: Bangers; font-weight: 400; font-display: swap; src: url('/node_modules/@fontsource/bangers/files/bangers-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Old Standard TT'; font-style: italic; font-weight: 400; font-display: swap; src: url('/node_modules/@fontsource/old-standard-tt/files/old-standard-tt-latin-400-italic.woff2') format('woff2'); }
      #phone-notice {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 11;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-areas: 'dev head' 'txt txt' 'btn btn';
        gap: 14px;
        align-items: center;
        padding: 22px 16px;
        background: #f6f1e3;
        border-top: 5px solid #1b1a1f;
        box-shadow: 0 -4px 0 #ffd23f;
        color: #1b1a1f;
        /* No pinch here either, as everywhere else on the page: a pinch on the notice left the game zoomed (Fable review P18). */
        touch-action: none;
      }
      #phone-notice[hidden] {
        display: none;
      }
      #phone-notice .devices {
        grid-area: dev;
        width: clamp(56px, 18vw, 104px);
        height: auto;
      }
      /* The heading starts the sentence the line finishes, so a screen reader reads it too: the dialog is named by it and described by the line. */
      #phone-notice-title {
        grid-area: head;
        justify-self: start;
        margin: 0;
        padding: 5px 26px 4px 12px;
        background: #1b1a1f;
        color: #ffd23f;
        clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
        font: 400 clamp(22px, 7.2vw, 36px) / 1 Bangers, Impact, 'Arial Black', sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      #phone-notice-text {
        grid-area: txt;
        margin: 0;
        font: italic 400 clamp(16px, 5.8vw, 24px) / 1.3 'Old Standard TT', Georgia, 'Times New Roman', serif;
        text-align: center;
      }
      #phone-notice-ok {
        grid-area: btn;
        min-height: 56px;
        margin: 0;
        padding: 0 24px;
        background: #ffd23f;
        color: #1b1a1f;
        border: 3px solid #1b1a1f;
        box-shadow: 3px 3px 0 #1b1a1f;
        font: 400 clamp(24px, 7vw, 32px) / 1 Oswald, 'Arial Narrow', Arial, sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #phone-notice-ok:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 #1b1a1f;
      }
      #phone-notice-ok:focus-visible {
        outline: 3px solid #f2267f;
        outline-offset: 3px;
      }
      /* The page a game step that failed leaves up (src/ui/stopped.ts), in the phone notice's paper, ink and yellow. */
      #game-stopped, #startup-failure {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(27, 26, 31, 0.72);
      }
      #game-stopped .sheet, #startup-failure .sheet {
        box-sizing: border-box;
        max-width: 32em;
        display: grid;
        gap: 16px;
        padding: 22px 20px;
        background: #f6f1e3;
        border: 5px solid #1b1a1f;
        box-shadow: 6px 6px 0 #ffd23f;
        color: #1b1a1f;
      }
      #game-stopped-title, #startup-failure-title {
        justify-self: start;
        margin: 0;
        padding: 5px 26px 4px 12px;
        background: #1b1a1f;
        color: #ffd23f;
        clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
        font: 400 clamp(22px, 6vw, 34px) / 1 Bangers, Impact, 'Arial Black', sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      #game-stopped-text, #startup-failure p {
        margin: 0;
        font: italic 400 clamp(16px, 4.6vw, 22px) / 1.35 'Old Standard TT', Georgia, 'Times New Roman', serif;
      }
      #game-stopped button, #startup-failure button {
        justify-self: center;
        min-height: 56px;
        padding: 0 28px;
        background: #ffd23f;
        color: #1b1a1f;
        border: 3px solid #1b1a1f;
        box-shadow: 3px 3px 0 #1b1a1f;
        font: 400 clamp(24px, 7vw, 32px) / 1 Oswald, 'Arial Narrow', Arial, sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }
      #game-stopped button:active, #startup-failure button:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 #1b1a1f;
      }
      #game-stopped button:focus-visible, #startup-failure button:focus-visible {
        outline: 3px solid #f2267f;
        outline-offset: 3px;
      }
      /* What went wrong, for anyone reporting it: small, under the button, and never wider than the page. */
      #startup-failure pre {
        max-height: 30vh;
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        font: 12px / 1.35 ui-monospace, Menlo, monospace;
        color: #57534b;
      }
      /* A phone held sideways: the picture, the words and the button side by side. */
      @media (orientation: landscape) and (max-height: 480px) {
        #phone-notice {
          grid-template-columns: auto 1fr auto;
          grid-template-areas: 'dev head btn' 'dev txt btn';
          gap: 8px 16px;
          padding: 16px 20px;
        }
        #phone-notice .devices {
          width: 84px;
        }
        #phone-notice-title {
          font-size: 28px;
        }
        #phone-notice-text {
          font-size: 20px;
        }
        #phone-notice-ok {
          min-width: 180px;
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <noscript><p id="no-script">That '80s Game needs JavaScript. Turn it on in your browser's settings, then reload this page.</p></noscript>
    <div id="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg viewBox="0 0 250 48" aria-hidden="true">
        <defs>
          <!-- Geometry only, shared by the blue fill, cross clipping and ink outline. -->
          <path id="loader-mouth" d="M0 0 L12.44 -8.39 A15 15 0 1 0 12.44 8.39 Z" />
          <clipPath id="loader-body-clip"><use href="#loader-mouth" /></clipPath>
        </defs>
        <g id="loader-dots" fill="#0083fc" stroke="#1b1a1f" stroke-width="1.5">
          <circle cx="50" cy="24" r="4" /><circle cx="69" cy="24" r="4" fill="#fff" /><circle cx="88" cy="24" r="4" /><circle cx="107" cy="24" r="4" fill="#fff" /><circle cx="126" cy="24" r="4" />
          <circle cx="145" cy="24" r="4" fill="#fff" /><circle cx="164" cy="24" r="4" /><circle cx="183" cy="24" r="4" fill="#fff" /><circle cx="202" cy="24" r="4" /><circle cx="221" cy="24" r="4" fill="#fff" />
        </g>
        <g id="loader-ball" data-from="22" data-to="232">
          <g transform="translate(22 24)">
            <!-- A simple blue ball, with its white cross centred and clipped to the moving mouth. -->
            <use href="#loader-mouth" fill="#0083fc" />
            <g clip-path="url(#loader-body-clip)">
              <path d="M-3 -16H3V16H-3Z M-16 -3H16V3H-16Z" fill="#fff" />
            </g>
            <use href="#loader-mouth" fill="none" stroke="#1b1a1f" stroke-width="3" stroke-linejoin="round" />
          </g>
        </g>
      </svg>
      <p id="loader-share" aria-hidden="true">0% loaded</p>
      <p id="loader-left" aria-hidden="true"></p>
      <script>
        // The ball chomps by redrawing its mouth each frame, from the moment the page opens: SVG's own
        // animation waits for the whole page to load, and CSS cannot reshape a path in every browser.
        // src/ui/loader.ts starts it again when the loading page comes back.
        // With the class `still` (reduced motion: the system's here, the game's own setting once it has
        // loaded) the mouth stays open.
        (() => {
          const l = document.getElementById('loader');
          const p = l.querySelector('#loader-mouth');
          const open = p.getAttribute('d');
          if (matchMedia('(prefers-reduced-motion: reduce)').matches) l.classList.add('still');
          let running = false;
          const frame = (t) => {
            if (l.hidden || l.classList.contains('still')) {
              p.setAttribute('d', open);
              running = false;
              return;
            }
            const a = ((3 + 31 * (0.5 + 0.5 * Math.cos((2 * Math.PI * t) / 640))) * Math.PI) / 180;
            const x = (15 * Math.cos(a)).toFixed(2);
            const y = (15 * Math.sin(a)).toFixed(2);
            p.setAttribute('d', `M0 0 L${x} -${y} A15 15 0 1 0 ${x} ${y} Z`);
            requestAnimationFrame(frame);
          };
          window.loaderChomp = () => {
            if (running || l.classList.contains('still')) return;
            running = true;
            requestAnimationFrame(frame);
          };
          window.loaderChomp();
        })();
      </script>
    </div>
    <div id="phone-notice" role="dialog" aria-modal="true" aria-labelledby="phone-notice-title" aria-describedby="phone-notice-text" hidden>
      <svg class="devices" viewBox="0 0 120 64" aria-hidden="true">
        <g transform="translate(3 3)"><rect x="3" y="4" width="22" height="42" rx="5" fill="#f2267f" /><rect x="0" y="1" width="22" height="42" rx="5" fill="#1b1a1f" stroke="#f6f1e3" stroke-width="2" /><rect x="3.5" y="6" width="15" height="29" fill="#22b8e8" /><circle cx="11" cy="39" r="1.6" fill="#f6f1e3" /></g>
        <path d="M36 25h20M50 17l9 8-9 8" fill="none" stroke="#f2267f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
        <g transform="translate(66 6)"><rect x="3" y="3" width="48" height="34" rx="3" fill="#f2267f" /><rect x="0" y="0" width="48" height="34" rx="3" fill="#1b1a1f" stroke="#f6f1e3" stroke-width="2" /><rect x="4" y="4" width="40" height="23" fill="#22b8e8" /><path d="M17 34l-3 10h20l-3-10M10 44h28" fill="#1b1a1f" stroke="#f6f1e3" stroke-width="2" stroke-linejoin="round" /></g>
      </svg>
      <h2 id="phone-notice-title">Best on a desktop</h2>
      <p id="phone-notice-text">The game works here, but the view may be a bit small.</p>
      <button id="phone-notice-ok" type="button">Play on Phone</button>
      <script>
        // Every load, where the head's script decided it applies (a screen inside 820 by 1100 either way round, taking touch).
        // Loading carries on behind it; src/ui/loader.ts keeps the loading page up until the button is pressed.
        // `window.phoneNotice` is what it reads: `open`, `onClose` (called once when the button is pressed), and `close()`.
        (() => {
          const n = document.getElementById('phone-notice');
          const l = document.getElementById('loader');
          if (!window.phoneNoticeApplies) {
            n.remove();
            return;
          }
          const ok = document.getElementById('phone-notice-ok');
          const state = (window.phoneNotice = {
            open: true,
            onClose: null,
            close() {
              if (!state.open) return;
              state.open = false;
              n.hidden = true;
              l.style.paddingBottom = '';
              l.inert = false;
              document.getElementById('phone-notice-probe')?.remove();
              const next = state.onClose;
              state.onClose = null;
              if (next) next();
            },
          });
          // The band is centred in the bottom half of the screen; only if it would cross the foot of the screen or the safe
          // area does it move up, by just what it crosses. The loading page is centred between the top of the screen and the
          // top of the band (its padding below is the screen's height less the band's top).
          const probe = document.createElement('div');
          probe.id = 'phone-notice-probe';
          probe.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;padding-bottom:env(safe-area-inset-bottom)';
          document.body.appendChild(probe);
          const place = () => {
            if (!state.open) return;
            const safe = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
            const h = n.offsetHeight;
            const top = Math.round(Math.min((innerHeight * 3) / 4 - h / 2, innerHeight - safe - h));
            n.style.top = `${top}px`;
            n.style.bottom = 'auto';
            l.style.paddingBottom = `${Math.round(innerHeight - top)}px`;
          };
          n.hidden = false;
          l.inert = true;
          place();
          ok.focus({ preventScroll: true });
          addEventListener('resize', place);
          visualViewport?.addEventListener('resize', place);
          document.fonts?.addEventListener('loadingdone', place);
          if (window.ResizeObserver) {
            const watch = new ResizeObserver(place);
            watch.observe(n);
          }
          ok.addEventListener('click', () => state.close());
          // Enter or Space, wherever focus is, while it is up. Caught on the way down and stopped there, so the game (which
          // listens at the window's bubble phase and would also take the key as "confirm" on the title) never sees it; the
          // sound's own listeners, at the window's capture phase, still do.
          addEventListener(
            'keydown',
            (e) => {
              if ((e.key !== 'Enter' && e.key !== ' ') || !state.open) return;
              e.preventDefault();
              e.stopPropagation();
              if (!e.repeat) state.close();
            },
            true,
          );
        })();
      </script>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
