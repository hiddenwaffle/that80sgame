# Enemy types. Map enemies refer to these by id (the `kind` property in Tiled).
# name: shown in the target list and the log's fight lines; two or more of one name in a fight are lettered (Ghost A, Ghost B, ...).
# timer: the turn prototype uses the mean of this range as logical recovery.
# Forecasting never consumes random numbers.

ghost_green:
  name: Ghost
  look: ghost_green
  hp: 200
  attack: 25
  xp: 35
  dots: 20
  timer: [2, 4]

ghost_red:
